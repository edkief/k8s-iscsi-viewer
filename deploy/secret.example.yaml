# TrueNAS API key for phase-2 zvol detail. Copy to secret.yaml, fill the key,
# and `kubectl apply -f secret.yaml`. Do NOT commit the real key.
#
# Create the key in TrueNAS: Settings → API Keys → Add.
apiVersion: v1
kind: Secret
metadata:
  name: iscsi-viewer-truenas
  namespace: iscsi-viewer
type: Opaque
stringData:
  api-key: "REPLACE_WITH_TRUENAS_API_KEY"
