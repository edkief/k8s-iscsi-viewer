apiVersion: v1
kind: ServiceAccount
metadata:
  name: iscsi-viewer
  namespace: iscsi-viewer
---
# Read-only access to exactly the resources the viewer joins. No write verbs anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iscsi-viewer
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments", "storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iscsi-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: iscsi-viewer
subjects:
  - kind: ServiceAccount
    name: iscsi-viewer
    namespace: iscsi-viewer
